<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revak Konak, Eski Mardin</title>
<meta name="description" content="Eski Mardin'de 1878 yapımı taş konakta 8 oda. Ovaya bakan teras, ev yapımı Mardin kahvaltısı, doğrudan rezervasyonda %10 indirim.">
<meta name="theme-color" content="#1d3a7a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&family=Reem+Kufi:wght@500;600&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   OTEL / KONAK DEMO
   Müşteriye uyarlamak için: alttaki CONFIG, ROOMS, T (çeviriler).
   Fotoğraflar ../assets/img altında; müşterinin kendi fotoğraflarıyla değiştir.
   ===================================================================== */
:root{
  --lime:#e2e6ee;      /* akşam göğü altında kireç badana, zemin */
  --lime-2:#d2d8e4;    /* gölgedeki badana */
  --paper:#f3f5f9;     /* açık yüzey */
  --honey:#94621f;     /* güneşte Mardin taşı */
  --sky:#1d3a7a;       /* Mardin göğü, marka rengi */
  --sky-2:#142a5a;
  --basalt:#28231d;    /* metin */
  --basalt-2:#4a4137;
  --rule:#b9c2d3;
  --ok:#25583a;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:Figtree,system-ui,sans-serif;background:var(--lime);color:var(--basalt);line-height:1.6;font-size:17px}
::selection{background:var(--sky);color:var(--paper)}
img{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.2em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
.d{font-family:Marcellus,Georgia,serif;font-weight:400;letter-spacing:-.005em}
[dir=rtl] body{font-family:'Noto Sans Arabic',Figtree,sans-serif}
[dir=rtl] .d{font-family:'Reem Kufi','Noto Sans Arabic',sans-serif;font-weight:600;letter-spacing:0}
h2.d{font-size:clamp(32px,4.4vw,56px);line-height:1.05;max-width:16ch}
[dir=rtl] h2.d{line-height:1.35}
.lede{color:var(--basalt-2);max-width:52ch}
section{padding:clamp(72px,10vw,140px) 0}
.tnum{font-variant-numeric:tabular-nums lining-nums}

/* buttons: one family */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-decoration:none;
  font-weight:600;font-size:16px;padding:15px 26px;border-radius:6px;transition:background .25s var(--ease),transform .15s var(--ease),color .25s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn-sky{background:var(--sky);color:var(--paper)}.btn-sky:hover{background:var(--sky-2)}
.btn-honey{background:var(--honey);color:#fff}.btn-honey:hover{background:#7d5219}
.btn-line{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}.btn-line:hover{background:rgba(255,255,255,.12)}
.btn svg{width:18px;height:18px;flex:none}

/* NAV */
nav{position:fixed;inset:0 0 auto;z-index:50;color:#fff;transition:background .35s,color .35s,box-shadow .35s}
nav.solid{background:var(--paper);color:var(--basalt);box-shadow:0 1px 0 var(--rule)}
nav .wrap{display:flex;align-items:center;gap:28px;height:72px}
.name{font-family:Marcellus,serif;font-size:23px;text-decoration:none;white-space:nowrap}
[dir=rtl] .name{font-family:'Reem Kufi',sans-serif}
.links{display:flex;gap:26px;font-size:15px;margin-inline-start:auto}
.links a{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .3s var(--ease)}
.links a:hover{background-size:100% 1px}
.langs{display:flex;border-radius:6px;box-shadow:inset 0 0 0 1px currentColor;overflow:hidden}
.langs button{background:none;border:0;font-size:13px;padding:6px 10px;cursor:pointer;opacity:.75}
.langs button[aria-pressed=true]{background:currentColor;opacity:1}
.langs button[aria-pressed=true] span{color:var(--sky)}
nav.solid .langs button[aria-pressed=true] span{color:var(--paper)}
nav .btn{padding:10px 18px;font-size:15px}
@media(max-width:920px){.links{display:none}.langs{margin-inline-start:auto}nav .btn{display:none}}

/* HERO */
.hero{position:relative;min-height:min(100svh,980px);display:grid;grid-template-rows:1fr auto;color:#fff;overflow:hidden;background:var(--sky-2)}
.hero picture,.hero>img{position:absolute;inset:0}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,24,48,.42) 0%,rgba(15,24,48,0) 30%,rgba(15,24,48,0) 45%,rgba(15,24,48,.78) 100%)}
.hero .wrap{position:relative;z-index:2;width:100%}
.hero-copy{align-self:end;padding-bottom:40px}
.hero h1{font-size:clamp(44px,8.2vw,118px);line-height:.95;max-width:11ch;letter-spacing:-.02em}
[dir=rtl] .hero h1{line-height:1.25;letter-spacing:0;font-size:clamp(38px,6.4vw,88px)}
.hero p{font-size:clamp(17px,1.6vw,20px);max-width:44ch;margin:22px 0 0;color:rgba(255,255,255,.9)}
.hero-copy .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.h-enter{animation:rise 1.1s var(--ease) both}
.h-enter.d2{animation-delay:.15s}.h-enter.d3{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(28px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* ledge: booking strip carved into the hero foot */
.ledge{position:relative;z-index:2;background:var(--paper);color:var(--basalt)}
.ledge form{display:grid;grid-template-columns:1.2fr 1.2fr 1fr 1.4fr auto;align-items:stretch}
.ledge .f{padding:16px 22px;border-inline-end:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;min-width:0}
.ledge label{font-size:13px;color:var(--basalt-2)}
.ledge input,.ledge select{border:0;background:none;font-size:17px;font-weight:600;padding:2px 0;min-height:40px;width:100%;cursor:pointer;min-width:0}
.ledge .btn{border-radius:0;padding:0 34px}
.ledge .note{grid-column:1/-1;font-size:14px;padding:9px 22px;background:var(--lime-2);color:var(--basalt-2);border-top:1px solid var(--rule)}
.ledge .note b{color:var(--ok)}
@media(max-width:900px){.ledge form{grid-template-columns:1fr 1fr}.ledge .f:nth-child(2n){border-inline-end:0}.ledge .f{border-bottom:1px solid var(--rule)}
  .ledge .btn{grid-column:1/-1;padding:16px}}

/* ROOMS: the arcade */
.rooms-head{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-bottom:56px}
.arcade{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,2vw,28px)}
.room{display:flex;flex-direction:column}
.arch{aspect-ratio:3/4.3;border-radius:999px 999px 0 0;overflow:hidden;background:var(--lime-2);position:relative;cursor:zoom-in}
.arch img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.room:hover .arch img{transform:scale(1.035)}
.room .base{border-top:3px solid var(--basalt);padding-top:16px;margin-top:0;display:flex;flex-direction:column;flex:1}
.room h3{font-size:clamp(22px,2vw,27px);line-height:1.15}
.room .spec{font-size:14px;color:var(--basalt-2);margin:6px 0 12px;display:flex;gap:14px;flex-wrap:wrap}
.room .spec span{display:inline-flex;align-items:center;gap:6px}
.room .spec svg{width:16px;height:16px}
.room p{font-size:15px;color:var(--basalt-2);flex:1}
.price{margin:18px 0 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price s{color:var(--basalt-2);font-size:15px;text-decoration-thickness:1px}
.price b{font-size:26px;font-weight:600}
.price small{font-size:14px;color:var(--basalt-2)}
.room .flag{font-size:13px;color:var(--ok);font-weight:600;margin-top:-8px;margin-bottom:14px}
.room .btn{width:100%}
@media(max-width:1020px){.arcade{grid-template-columns:1fr 1fr;row-gap:56px}}
@media(max-width:560px){.arcade{grid-template-columns:1fr}.arch{aspect-ratio:4/4.4}.rooms-head{grid-template-columns:1fr;gap:16px}}

/* A DAY: real sequence of times */
.day{background:var(--sky);color:var(--paper)}
.day .lede{color:rgba(247,242,232,.9)}
.day-list{margin-top:64px;display:grid;gap:0}
.moment{display:grid;grid-template-columns:140px 1fr 1.25fr;gap:clamp(20px,4vw,56px);align-items:center;padding:34px 0;border-top:1px solid rgba(247,242,232,.22)}
.moment time{font-family:Marcellus,serif;font-size:clamp(34px,3.6vw,48px);color:#e8c48a;line-height:1}
.moment h3{font-size:clamp(24px,2.4vw,32px);line-height:1.15;margin-bottom:8px}
.moment p{color:rgba(247,242,232,.92);max-width:42ch}
.moment figure{aspect-ratio:16/9;overflow:hidden;border-radius:4px}
.moment img{width:100%;height:100%;object-fit:cover}
@media(max-width:820px){.moment{grid-template-columns:1fr;gap:14px}.moment figure{order:3}}

/* HOUSE */
.house{display:grid;grid-template-columns:5fr 6fr;gap:clamp(32px,6vw,96px);align-items:center}
.door{aspect-ratio:4/5.4;border-radius:999px 999px 0 0;overflow:hidden}
.door img{width:100%;height:100%;object-fit:cover}
.facts{margin-top:36px;display:grid;grid-template-columns:repeat(2,1fr);gap:22px 32px}
.facts div{display:flex;gap:14px;align-items:flex-start;font-size:15px;color:var(--basalt-2)}
.facts b{display:block;color:var(--basalt);font-weight:600;font-size:16px}
.facts svg{width:26px;height:26px;flex:none;color:var(--honey);margin-top:2px}
@media(max-width:820px){.house{grid-template-columns:1fr}.door{max-width:420px;aspect-ratio:4/4.6}}
@media(max-width:480px){.facts{grid-template-columns:1fr}}

/* GALLERY */
.gal{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(120px,14vw,190px);gap:10px;margin-top:48px}
.gal button{border:0;padding:0;overflow:hidden;background:var(--lime-2);cursor:zoom-in;border-radius:3px}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.gal button:hover img{transform:scale(1.03)}
.gal button:nth-child(1){grid-column:span 7;grid-row:span 2}
.gal button:nth-child(2){grid-column:span 5;grid-row:span 1}
.gal button:nth-child(3){grid-column:span 5;grid-row:span 1}
.gal button:nth-child(4){grid-column:span 4;grid-row:span 2}
.gal button:nth-child(5){grid-column:span 4;grid-row:span 2}
.gal button:nth-child(6){grid-column:span 4;grid-row:span 2}
@media(max-width:700px){.gal{grid-template-columns:1fr 1fr;grid-auto-rows:150px}.gal button:nth-child(n){grid-column:span 1;grid-row:span 1}.gal button:nth-child(1),.gal button:nth-child(6){grid-column:span 2;grid-row:span 2}}

/* REVIEWS */
.reviews{background:var(--paper)}
.rv{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(32px,6vw,90px);align-items:start}
.big q{font-family:Marcellus,serif;font-size:clamp(26px,3vw,40px);line-height:1.25;quotes:"“" "”";display:block}
[dir=rtl] .big q{font-family:'Noto Sans Arabic',sans-serif;font-weight:600;line-height:1.7;font-size:clamp(22px,2.4vw,30px)}
.who{margin-top:22px;font-size:15px;color:var(--basalt-2)}
.who b{color:var(--basalt)}
.score{display:flex;align-items:baseline;gap:12px;margin-bottom:34px}
.score b{font-family:Marcellus,serif;font-size:64px;line-height:1;color:var(--sky)}
.score span{font-size:15px;color:var(--basalt-2);max-width:20ch}
.small{border-top:1px solid var(--rule);padding:22px 0}
.small p{font-size:16px}
.small .who{margin-top:8px;font-size:14px}
@media(max-width:820px){.rv{grid-template-columns:1fr}}

/* LOCATION */
.loc{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(32px,5vw,72px);align-items:start}
.walk{margin-top:34px;border-top:1px solid var(--rule)}
.walk li{list-style:none;display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--rule)}
.walk li span:last-child{color:var(--basalt-2);white-space:nowrap}
.map{border:0;width:100%;height:100%;min-height:440px;border-radius:4px;filter:saturate(.75) contrast(1.02)}
.addr{margin-top:22px;color:var(--basalt-2);font-size:15px}
@media(max-width:820px){.loc{grid-template-columns:1fr}.map{min-height:320px}}

/* FAQ */
.faq{max-width:860px}
.faq details{border-top:1px solid var(--rule)}
.faq details:last-child{border-bottom:1px solid var(--rule)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;padding:20px 0;font-weight:600;font-size:18px}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{width:20px;height:20px;flex:none;transition:transform .3s var(--ease);color:var(--honey)}
.faq details[open] summary svg{transform:rotate(45deg)}
.faq details p{padding:0 0 22px;color:var(--basalt-2);max-width:62ch}

/* FOOTER */
footer{background:var(--sky-2);color:rgba(247,242,232,.93);padding:72px 0 28px;font-size:15px}
footer .top{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
footer .name{font-size:34px;color:var(--paper);display:block;margin-bottom:12px}
footer a{color:var(--paper)}
footer .credit{margin-top:56px;padding-top:18px;border-top:1px solid rgba(247,242,232,.16);font-size:12px;color:rgba(247,242,232,.55)}
footer .credit a{color:inherit}
@media(max-width:760px){footer .top{grid-template-columns:1fr}}

/* MOBILE BAR */
.mbar{position:fixed;inset:auto 0 0;z-index:40;background:var(--paper);box-shadow:0 -1px 0 var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;gap:10px}
@media(max-width:760px){.mbar{display:flex}.mbar .btn{flex:1;padding:13px}body{padding-bottom:72px}}

/* SHEET (booking) */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(20,26,40,.55);backdrop-filter:blur(3px)}
.sheet{background:var(--paper);width:min(560px,100%);margin:auto;max-height:100%;overflow:auto;padding:30px;border-radius:8px;position:relative;
  animation:sheet .5s var(--ease)}
dialog[open]{display:flex;align-items:center;padding:16px}
@keyframes sheet{from{opacity:0;transform:translateY(20px)}}
@media(max-width:560px){dialog[open]{align-items:flex-end;padding:0}.sheet{border-radius:14px 14px 0 0;padding:24px 18px}}
.sheet h2{font-size:30px;margin-bottom:6px;padding-inline-end:40px}
.sheet .sub{color:var(--basalt-2);font-size:15px}
.x{position:absolute;top:16px;inset-inline-end:16px;width:40px;height:40px;border:0;border-radius:50%;background:var(--lime);cursor:pointer;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.fld label{display:block;font-size:14px;color:var(--basalt-2);margin-bottom:6px}
.fld input,.fld select{width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:6px;background:#fff;font-size:16px}
.fld input:focus,.fld select:focus{outline:2px solid var(--sky);outline-offset:0;border-color:transparent}
.fld.full{grid-column:1/-1}
.sum{border-top:1px solid var(--rule);font-size:15px}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--rule)}
.sum .save{color:var(--ok);font-weight:600}
.sum .tot{font-size:20px;font-weight:600;border-bottom:0}
.err{color:#a3261b;font-size:14px;min-height:22px;margin:8px 0}
.sheet .btn{width:100%}
.sheet .fine{text-align:center;font-size:13px;color:var(--basalt-2);margin-top:12px}

/* LIGHTBOX */
.lb{position:fixed;inset:0;background:rgba(12,16,28,.94);display:none;align-items:center;justify-content:center;z-index:120;padding:20px;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:3px}
#footWa{display:inline-block;padding-block:10px}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<nav id="nav" aria-label="Ana menü"><div class="wrap">
  <a href="#top" class="name" data-c="name"></a>
  <div class="links"><a href="#odalar" data-t="nRooms"></a><a href="#gun" data-t="nDay"></a><a href="#galeri" data-t="nGallery"></a><a href="#konum" data-t="nLoc"></a></div>
  <div class="langs" role="group" aria-label="Dil"><button data-l="tr"><span>TR</span></button><button data-l="en"><span>EN</span></button><button data-l="ar" lang="ar"><span>ع</span></button></div>
  <button class="btn btn-honey" data-open data-t="book"></button>

let L = new URLSearchParams(location.search).get("lang") || (()=>{try{return localStorage.getItem("konakLang")}catch(e){return null}})() || "tr";
if(!T[L]) L = "tr";
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const t = k => T[L][k] ?? k;
const loc = () => L==="ar" ? "ar-EG" : L==="en" ? "en-GB" : "tr-TR";
const money = n => Math.round(n).toLocaleString(loc()) + " ₺";
const wa = msg => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
const iso = d => d.toISOString().slice(0,10);
const direct = p => p * (1 - CONFIG.directDiscount/100);
const ico = id => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;

function render(){
  const root = document.documentElement;
  root.lang = L; root.dir = L==="ar" ? "rtl" : "ltr";
  $$("[data-t]").forEach(e => e.innerHTML = t(e.dataset.t).replace("{d}",CONFIG.directDiscount));
  $$("[data-c]").forEach(e => e.textContent = CONFIG[e.dataset.c]);
  $$("[data-alt]").forEach(e => e.alt = t(e.dataset.alt));
  $$(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l===L));
  $("#ledgeNote").innerHTML = t("ledge").replace("{d}",CONFIG.directDiscount);
  ["#heroWa","#mbarWa","#footWa"].forEach(s => $(s).href = wa(t("waAsk")));
  document.title = `${CONFIG.name}, ${L==="ar"?"ماردين القديمة":L==="en"?"Old Mardin":"Eski Mardin"}`;

  $("#arcade").innerHTML = ROOMS.map(r => `
    <article class="room">
      <div class="arch" data-zoom="${r.img}"><img loading="lazy" src="${r.img}" alt="${r.n[L]}"></div>
      <div class="base">
        <h3 class="d">${r.n[L]}</h3>
        <div class="spec"><span>${ico("i-user")} ${r.cap} ${t("upTo")}</span><span>${ico("i-area")} ${r.size} ${t("m2")}</span></div>
        <p>${r.d[L]}</p>
        <div class="price tnum"><b>${money(direct(r.price))}</b><s>${money(r.price)}</s><small>/ ${t("night")}</small></div>
        <div class="flag">${t("direct").replace("{d}",CONFIG.directDiscount)}</div>
        <button class="btn btn-sky" data-room="${r.id}">${t("bookRoom")}</button>
      </div>
    </article>`).join("");

  $("#dayList").innerHTML = DAY.map(m => `
    <div class="moment"><time>${m.time}</time><div><h3 class="d">${m.t[L]}</h3><p>${m.d[L]}</p></div>
    <figure><img loading="lazy" src="${m.img}" alt="${m.t[L]}"></figure></div>`).join("");

  $("#facts").innerHTML = FACTS[L].map(f => `<div>${ico(f[0])}<span><b>${f[1]}</b>${f[2]}</span></div>`).join("");
  $("#gal").innerHTML = GALLERY.map(g => `<button aria-label="${t("nGallery")}" data-zoom="${IMG(g)}"><img loading="lazy" src="${IMG(g)}" alt=""></button>`).join("");

  const [first,...rest] = REVIEWS;
  $("#rv").innerHTML = `<div class="big"><q>${first[L]}</q><div class="who"><b>${first.who}</b>, ${first.from[L]}</div></div>
    <div><div class="score"><b class="tnum">9,4</b><span>${t("scoreLabel")}</span></div>
    ${rest.map(r=>`<div class="small"><p>${r[L]}</p><div class="who"><b>${r.who}</b>, ${r.from[L]}</div></div>`).join("")}</div>`;

  $("#walk").innerHTML = NEAR[L].map(n => `<li><span>${n[0]}</span><span>${n[1]}</span></li>`).join("");
  $("#faq").innerHTML = FAQ[L].map(f => `<details><summary>${f[0]}${ico("i-plus")}</summary><p>${f[1]}</p></details>`).join("");
  $("#credit").innerHTML = `${t("credit")}: MSinjari, Volker Höhfeld, AKADLAR, Dosseman, Hamdigumus, Nevit Dilmen, Jwslubbock (CC BY / CC BY-SA / CC0).`;

  const gOpts = [1,2,3,4].map(n=>`<option value="${n}">${n} ${t("person")}</option>`).join("");
  const rOpts = ROOMS.map(r=>`<option value="${r.id}">${r.n[L]}</option>`).join("");
  ["#bG","#mG"].forEach(s => { const v=$(s).value||2; $(s).innerHTML=gOpts; $(s).value=v; });
  ["#bR","#mR"].forEach(s => { const v=$(s).value||"ova"; $(s).innerHTML=rOpts; $(s).value=v; });
  if($("#modal").open) calc();
}

function calc(){
  const r = ROOMS.find(x=>x.id===$("#mR").value), g = +$("#mG").value;
  const n = Math.round((new Date($("#mOut").value) - new Date($("#mIn").value))/864e5);
  $("#err").textContent = "";
  if(!(n>0)){ $("#sum").innerHTML = ""; $("#err").textContent = t("errDates"); return null; }
  if(g > r.cap) $("#err").textContent = t("errCap").replace("{c}",r.cap);
  const ota = r.price*n, dir = direct(r.price)*n;
  $("#sum").innerHTML = `
    <div><span>${r.n[L]}, ${n} ${t("nights")}</span><span>${g} ${t("person")}</span></div>
    <div><span>${t("otaPrice")}</span><s>${money(ota)}</s></div>
    <div class="save"><span>${t("save")}</span><span>${money(ota-dir)}</span></div>
    <div class="tot"><span>${t("total")}</span><span>${money(dir)}</span></div>`;
  return {r,g,n,dir};
}
function openBook(roomId){
  $("#mR").value = roomId || $("#bR").value;
  $("#mIn").value = $("#bIn").value; $("#mOut").value = $("#bOut").value; $("#mG").value = $("#bG").value;
  $("#modal").showModal(); calc();
}
document.addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if(o){ openBook(); return; }
  const r = e.target.closest("[data-room]"); if(r){ openBook(r.dataset.room); return; }
  const z = e.target.closest("[data-zoom]"); if(z){ $("#lbImg").src = z.dataset.zoom; $("#lb").classList.add("open"); }
});
$("#lb").onclick = () => $("#lb").classList.remove("open");
$("#closeBtn").onclick = () => $("#modal").close();
$("#modal").addEventListener("click", e => { if(e.target.id==="modal") $("#modal").close(); });
["#mIn","#mOut","#mG","#mR"].forEach(s => $(s).addEventListener("change", calc));
$("#bookbar").addEventListener("submit", e => { e.preventDefault(); openBook(); });
const fmtD = v => v.split("-").reverse().join(".");
$("#sendWa").addEventListener("click", e => {
  const c = calc(), name = $("#mName").value.trim();
  if(!c || c.g > c.r.cap){ e.preventDefault(); return; }
  if(!name){ e.preventDefault(); $("#err").textContent = t("errName"); $("#mName").focus(); return; }
  const msg = `${t("waHello")}\n\n${t("yourName")}: ${name}\n${t("room")}: ${c.r.n[L]}\n${t("in")}: ${fmtD($("#mIn").value)}\n${t("out")}: ${fmtD($("#mOut").value)} (${c.n} ${t("nights")})\n${t("guests")}: ${c.g}\n${t("total")}: ${money(c.dir)}`;
  e.currentTarget.href = wa(msg);
});

const d1 = new Date(); d1.setDate(d1.getDate()+1);
const d2 = new Date(); d2.setDate(d2.getDate()+3);
["#bIn","#mIn"].forEach(s => { $(s).value = iso(d1); $(s).min = iso(new Date()); });
["#bOut","#mOut"].forEach(s => { $(s).value = iso(d2); $(s).min = iso(d1); });
$("#map").src = `https://maps.google.com/maps?q=${encodeURIComponent(CONFIG.mapQuery)}&z=16&output=embed`;

$$(".langs button").forEach(b => b.onclick = () => { L=b.dataset.l; try{localStorage.setItem("konakLang",L)}catch(e){} render(); });
const nav = $("#nav");
const onScroll = () => nav.classList.toggle("solid", scrollY > innerHeight*.6);
addEventListener("scroll", onScroll, {passive:true}); onScroll();
document.addEventListener("keydown", e => { if(e.key==="Escape") $("#lb").classList.remove("open"); });
render();
</script>
</body>
</html>
