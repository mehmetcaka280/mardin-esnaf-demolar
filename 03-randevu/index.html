<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Usta Makas, online randevu</title>
<meta name="theme-color" content="#f3f1ea">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   BERBER / KUAFÖR RANDEVU DEMO
   Müşteriye uyarlamak için: CONFIG, SERVICES, STAFF (alttaki <script>).
   Randevular bu demoda tarayıcıda saklanır; canlıda sunucuya bağlanır.
   ===================================================================== */
:root{
  --tile:#f3f1ea;     /* salon fayansı */
  --mint:#cfe5d8;     /* eski berber yeşili */
  --mint-2:#a9cdb9;
  --green:#22594a;    /* koltuk derisi, ana renk */
  --green-2:#173f34;
  --red:#c2352a;      /* berber direği */
  --ink:#18211d;
  --ink-2:#56615a;
  --rule:#d9d8cd;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:Archivo,system-ui,sans-serif;font-stretch:100%;background:var(--tile);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
::selection{background:var(--green);color:#fff}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
.tnum{font-variant-numeric:tabular-nums}
.sign{font-stretch:62%;font-weight:800;letter-spacing:-.01em;line-height:.88}

/* barber-pole edge: the one decorative device */
.pole{height:8px;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,#fff 12px 24px,var(--green) 24px 36px,#fff 36px 48px)}

.page{max-width:1180px;margin:0 auto;padding:0 clamp(16px,3vw,32px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,4vw,56px);align-items:start}
@media(max-width:900px){.page{grid-template-columns:minmax(0,1fr);gap:0}}

/* left: the shop */
.shop{position:sticky;top:0;padding:32px 0}
.shop h1{font-size:clamp(64px,8vw,112px);color:var(--green);animation:in .8s var(--ease) both}
.shop .photo{margin-top:22px;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--mint)}
.shop .photo img{width:100%;height:100%;object-fit:cover;filter:sepia(.18) contrast(1.05)}
.status{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:18px;font-size:15px;color:var(--ink-2)}
.status b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:7px;background:var(--green);box-shadow:0 0 0 3px var(--mint)}
.dot.off{background:var(--red);box-shadow:0 0 0 3px #f3d3cf}
.hours{margin-top:22px;border-top:1px solid var(--rule)}
.hours div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.hours div span:last-child{color:var(--ink-2)}
.hours .today{font-weight:600}
.hours .today span:last-child{color:var(--ink)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@media(max-width:900px){
  .shop{position:static;padding:20px 0 0;display:grid;grid-template-columns:1fr auto;gap:0 16px;align-items:end}
  .shop h1{font-size:clamp(52px,15vw,80px)}
  .shop .photo{grid-column:1/-1;aspect-ratio:16/9;margin-top:16px}
  .shop .status{grid-column:1/-1}
  .hours{display:none}
}

/* right: the booking ticket */
.desk{padding:32px 0 140px}
.tabs{display:inline-flex;background:var(--mint);border-radius:999px;padding:4px;margin-bottom:22px}
.tabs button{border:0;background:none;padding:9px 18px;border-radius:999px;font-weight:600;font-size:15px;color:var(--green-2)}
.tabs button[aria-selected=true]{background:var(--green);color:#fff}
.ticket{background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--rule),0 18px 40px -24px rgba(23,63,52,.35);overflow:hidden}
.ticket .body{padding:clamp(18px,3vw,30px)}
@media(max-width:900px){.desk{padding-top:24px}}

/* step track: a real sequence, so it is numbered */
.track{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule)}
.track span{padding:12px 10px;font-size:13px;color:var(--ink-2);display:flex;gap:7px;align-items:center;border-bottom:3px solid transparent;margin-bottom:-1px}
.track span i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--tile)}
.track span.on{color:var(--ink);font-weight:600;border-color:var(--red)}
.track span.on i{background:var(--red);color:#fff}
.track span.ok i{background:var(--green);color:#fff}
@media(max-width:480px){.track span{font-size:0;justify-content:center}.track span i{font-size:11.5px}}

h2{font-size:clamp(26px,3vw,32px);font-stretch:80%;font-weight:700;line-height:1.1;margin-bottom:16px}
h2 small{display:block;font-size:14px;font-stretch:100%;font-weight:400;color:var(--ink-2);margin-top:6px}

/* options as a price list, not cards */
.svc{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;width:100%;text-align:start;border:0;background:none;padding:15px 12px;border-bottom:1px solid var(--rule);border-radius:0;transition:background .15s}
.svc:first-child{border-top:1px solid var(--rule)}
.svc:hover{background:var(--tile)}
.svc b{font-size:17px;font-weight:600}
.svc small{grid-column:1;color:var(--ink-2);font-size:14px}
.svc .p{grid-row:1/3;grid-column:2;font-weight:700;font-size:18px}
.svc .tag{color:var(--red);font-weight:600}
.svc[aria-pressed=true]{background:var(--mint);box-shadow:inset 4px 0 0 var(--green)}
[dir=rtl] .svc[aria-pressed=true]{box-shadow:inset -4px 0 0 var(--green)}

.barbers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.barber{border:1px solid var(--rule);background:#fff;border-radius:12px;padding:18px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .15s,background .15s}
.barber:hover{border-color:var(--green)}
.barber[aria-pressed=true]{background:var(--mint);border-color:var(--green)}
.mono{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:800;font-stretch:70%;font-size:26px;margin-bottom:6px}
.mono.any{background:var(--tile);color:var(--green)}
.mono svg{width:28px;height:28px}
.barber b{font-size:16px}
.barber small{font-size:13px;color:var(--ink-2);line-height:1.35}
@media(max-width:480px){.barbers{grid-template-columns:1fr}.barber{flex-direction:row;text-align:start;gap:14px;padding:12px}.mono{margin:0;width:52px;height:52px;font-size:22px}}

.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.day{flex:none;width:64px;border:1px solid var(--rule);background:#fff;border-radius:10px;padding:8px 0;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.day small{font-size:12px;color:var(--ink-2)}
.day b{font-size:22px;font-stretch:75%;font-weight:700;margin:2px 0}
.day[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.day[aria-pressed=true] small{color:var(--mint)}
.day:disabled{opacity:.4;cursor:not-allowed;background:repeating-linear-gradient(-45deg,#fff 0 6px,var(--tile) 6px 12px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-2);margin-bottom:12px}
.legend .brk{color:var(--red);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{border:1px solid var(--mint-2);background:#fff;border-radius:8px;padding:10px 0;font-weight:600;font-size:15px;transition:background .12s}
.slot:hover:not(:disabled){background:var(--mint)}
.slot[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.slot:disabled{border-color:transparent;background:var(--tile);color:#b3b5ab;text-decoration:line-through;cursor:not-allowed}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);background:var(--tile);border-radius:10px}

.fld{margin-bottom:14px}
.fld label{display:block;font-size:14px;color:var(--ink-2);margin-bottom:6px}
.fld input{width:100%;padding:13px 14px;border:1px solid var(--rule);border-radius:8px;font-size:16px;background:#fff}
.fld input:focus{outline:2px solid var(--green);outline-offset:0;border-color:transparent}
.fld input[aria-invalid=true]{border-color:var(--red);background:#fdf3f2}
.fld .err{color:var(--red);font-size:13.5px;margin-top:5px}
.summary{margin:20px 0 6px;border-top:2px dashed var(--rule)}
.summary div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.summary div span:first-child{color:var(--ink-2)}
.summary .tot{font-size:19px;font-weight:700;border-bottom:0}
.summary .tot span:first-child{color:var(--ink)}
.note{font-size:13.5px;color:var(--ink-2);margin-top:10px}

.done{text-align:center;padding:8px 0 4px}
.done .ck{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto 14px;animation:pop .5s var(--ease)}
.done .ck svg{width:30px;height:30px}
@keyframes pop{from{transform:scale(.6);opacity:0}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:14px 22px;font-weight:600;font-size:16px;text-decoration:none;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn-go{background:var(--green);color:#fff}.btn-go:hover{background:var(--green-2)}
.btn-go:disabled{background:#b9c2bc;cursor:not-allowed}
.btn-q{background:var(--tile);color:var(--ink)}.btn-q:hover{background:var(--rule)}
.btn-wa{background:#1f7a4d;color:#fff;width:100%;margin-top:18px}
.actions{display:flex;gap:10px;padding:14px clamp(18px,3vw,30px);border-top:1px solid var(--rule);background:#fcfcfa}
.actions .btn-go{flex:1}
@media(max-width:900px){.actions{position:fixed;inset:auto 0 0;z-index:9;padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -1px 0 var(--rule)}}

/* panel */
.panel .hello{font-size:14.5px;color:var(--green-2);background:var(--mint);border-radius:10px;padding:12px 14px;margin-bottom:18px}
.pdays{display:flex;gap:6px;overflow-x:auto;margin-bottom:18px;scrollbar-width:thin}
.pdays button{flex:none;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px}
.pdays button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule);border-radius:12px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi+.kpi{border-inline-start:1px solid var(--rule)}
.kpi b{display:block;font-size:30px;font-stretch:70%;font-weight:800;line-height:1.1}
.kpi small{font-size:13px;color:var(--ink-2)}
.appt{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.appt .tm{font-weight:700;font-size:18px;font-stretch:75%}
.appt b{font-weight:600}
.appt small{display:block;font-size:13.5px;color:var(--ink-2)}
.appt .new{display:inline-block;margin-inline-start:8px;font-size:11.5px;font-weight:700;color:#fff;background:var(--red);padding:1px 7px;border-radius:999px;vertical-align:2px}
.appt .ops{display:flex;gap:6px}
.appt .ops a,.appt .ops button{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:7px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink)}
.appt .ops svg{width:15px;height:15px}
footer{grid-column:1/-1;font-size:11.5px;color:#8f938a;padding:0 0 100px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-any" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3M13.5 15c.8-.2 1.6-.3 2.5-.3 2.4 0 4.4 1.5 5 4.3"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></symbol>
</svg>
<div class="pole" aria-hidden="true"></div>

<div class="page">
  <aside class="shop">
    <h1 class="sign" id="bName"></h1>
    <div class="photo"><img src="../assets/img/photo-f69458859-960.jpg" srcset="../assets/img/photo-f69458859-500.jpg 500w, ../assets/img/photo-f69458859-960.jpg 960w" sizes="(min-width:900px) 45vw, 100vw" alt="Salonun içi" fetchpriority="high"></div>
    <div class="status"><span id="openNow"></span><span id="bAddr"></span></div>
    <div class="hours" id="hours"></div>
  </aside>

  <section class="desk">
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="book">Randevu al</button><button role="tab" aria-selected="false" data-tab="panel">Esnaf paneli</button></div>
    <div class="ticket" id="bookWrap">
      <div class="track" id="track"></div>
      <div class="body" id="book"></div>
      <div class="actions" id="bar"><button class="btn btn-q" id="back">Geri</button><button class="btn btn-go" id="next">Devam et</button></div>
    </div>
    <div class="ticket panel" id="panelWrap" hidden><div class="body" id="panel"></div></div>
  </section>
  <footer>Fotoğraf: Omer Unlu, Wikimedia Commons (CC BY 2.0). Örnek görseldir; salonun kendi fotoğrafıyla değiştirilir.</footer>
</div>

<script>
/* ============================ CONFIG ============================ */
const CONFIG = {
  name: "Usta Makas",
  address: "Adnan Menderes Caddesi, Kızıltepe",
  whatsapp: "905000000000",
  slotMin: 30,
  hours: {open:"09:00", close:"21:00"},
  closedDays: [0],                                                   // 0 = Pazar
  breaks: [{day:5, from:"12:30", to:"14:00", label:"Cuma namazı arası"}], // 5 = Cuma
  daysAhead: 10
};
const SERVICES = [
  {id:"sac",   n:"Saç kesimi",          min:30,  p:200},
  {id:"sakal", n:"Sakal tıraşı",        min:30,  p:120},
  {id:"ikili", n:"Saç ve sakal",        min:60,  p:300, tag:"En çok alınan"},
  {id:"cocuk", n:"Çocuk tıraşı",        min:30,  p:150},
  {id:"cilt",  n:"Cilt bakımı",         min:30,  p:250},
  {id:"damat", n:"Damat tıraşı",        min:120, p:2500, tag:"Fotoğraf çekimi ve ikram dahil"}
];
const STAFF = [
  {id:"mehmet", n:"Mehmet Usta", r:"15 yıldır makas başında, klasik kesim"},
  {id:"yusuf",  n:"Yusuf Usta",  r:"Modern kesim ve fade"},
  {id:"any",    n:"Fark etmez",  r:"İlk boş olan usta"}
];
/* ============================ KOD ============================ */
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const DAYS = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const DAYS_L = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const MONTHS = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const tl = n => n.toLocaleString("tr-TR") + " ₺";
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
const toStr = m => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");
const dkey = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dlabel = k => { const d = new Date(k+"T12:00"); return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${DAYS_L[d.getDay()]}`; };
const ico = id => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("randevular")||"[]"); }catch(e){ return []; } },
  set(v){ try{ localStorage.setItem("randevular", JSON.stringify(v)); }catch(e){} }
};

/* Demo için örnek dolu randevular (aynı gün için hep aynı sonucu verir) */
const NAMES = ["Ahmet Y.","Murat K.","Serhat D.","Ömer A.","Baran T.","Kadir S.","Emre Ç.","Hasan B.","Mahmut E.","Rıdvan Ö.","Cihan G.","Fırat İ."];
function seeded(key, staff){
  let h = 0; for(const c of key+staff) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h*1103515245 + 12345) >>> 0) / 4294967296;
  const out = [];
  for(let m = toMin(CONFIG.hours.open); m < toMin(CONFIG.hours.close); m += CONFIG.slotMin){
    if(rnd() < .38){ const s = SERVICES[Math.floor(rnd()*4)]; out.push({date:key, time:toStr(m), staff, svc:s.id, name:NAMES[Math.floor(rnd()*NAMES.length)], phone:"05XX", seed:true}); m += s.min - CONFIG.slotMin; }
  }
  return out;
}
function allAppts(key){
  const real = store.get().filter(a => a.date===key);
  const seed = STAFF.filter(s=>s.id!=="any").flatMap(s => seeded(key, s.id));
  return [...seed, ...real].sort((a,b) => a.time.localeCompare(b.time));
}
function busy(key, staff){
  const set = new Set();
  allAppts(key).filter(a => a.staff===staff).forEach(a => {
    const s = SERVICES.find(x=>x.id===a.svc);
    for(let m = toMin(a.time); m < toMin(a.time)+s.min; m += CONFIG.slotMin) set.add(m);
  });
  return set;
}
function freeSlots(key, staffId, dur){
  const d = new Date(key+"T12:00"), now = new Date(), isToday = key===dkey(now);
  const nowMin = now.getHours()*60 + now.getMinutes();
  const brk = CONFIG.breaks.filter(b => b.day===d.getDay());
  const staffList = staffId==="any" ? STAFF.filter(s=>s.id!=="any").map(s=>s.id) : [staffId];
  const res = [];
  for(let m = toMin(CONFIG.hours.open); m + dur <= toMin(CONFIG.hours.close); m += CONFIG.slotMin){
    if(brk.some(b => m < toMin(b.to) && m + dur > toMin(b.from))) continue;
    const past = isToday && m <= nowMin + 15;
    const who = staffList.find(sid => { const b = busy(key, sid); for(let x=m; x<m+dur; x+=CONFIG.slotMin) if(b.has(x)) return false; return true; });
    res.push({t:toStr(m), free: !past && !!who, staff: who});
  }
  return res;
}
function days(){
  const out = [], d = new Date();
  for(let i=0; out.length < CONFIG.daysAhead; i++){ const x = new Date(d); x.setDate(d.getDate()+i); out.push(x); }
  return out;
}

/* ---------- Randevu akışı ---------- */
const S = {step:0, svc:null, staff:null, date:null, time:null, staffAssigned:null, name:"", phone:"", errs:{}};
const STEPS = ["Hizmet","Usta","Saat","Bilgiler"];
function render(){
  const step = S.step;
  $("#track").hidden = step===4;
  $("#track").innerHTML = STEPS.map((s,i)=>`<span class="${i===step?"on":i<step?"ok":""}"><i>${i<step?"✓":i+1}</i>${s}</span>`).join("");
  let h = "";
  if(step===0){
    h = `<h2>Ne yaptırmak istersiniz?</h2><div>${SERVICES.map(s=>`
      <button class="svc" data-svc="${s.id}" aria-pressed="${S.svc===s.id}"><b>${s.n}</b><span class="p tnum">${tl(s.p)}</span>
      <small>${s.min} dakika${s.tag?`, <span class="tag">${s.tag}</span>`:""}</small></button>`).join("")}</div>`;
  }
  if(step===1){
    h = `<h2>Hangi usta?</h2><div class="barbers">${STAFF.map(s=>`
      <button class="barber" data-staff="${s.id}" aria-pressed="${S.staff===s.id}">
        <span class="mono ${s.id==="any"?"any":""}">${s.id==="any"?ico("i-any"):s.n[0]}</span>
        <span><b>${s.n}</b><br><small>${s.r}</small></span></button>`).join("")}</div>`;
  }
  if(step===2){
    const svc = SERVICES.find(s=>s.id===S.svc);
    if(!S.date){ const first = days().find(d=>!CONFIG.closedDays.includes(d.getDay())); S.date = dkey(first); }
    const sl = freeSlots(S.date, S.staff, svc.min), nFree = sl.filter(s=>s.free).length;
    const brk = CONFIG.breaks.find(b => b.day===new Date(S.date+"T12:00").getDay());
    h = `<h2>Gün ve saat<small>${svc.n}, ${svc.min} dakika</small></h2>
      <div class="days">${days().map(d=>{const k=dkey(d), off=CONFIG.closedDays.includes(d.getDay());
        return `<button class="day" data-day="${k}" aria-pressed="${S.date===k}" ${off?"disabled":""}><small>${DAYS[d.getDay()]}</small><b class="tnum">${d.getDate()}</b><small>${off?"Kapalı":MONTHS[d.getMonth()]}</small></button>`}).join("")}</div>
      <div class="legend"><span>${dlabel(S.date)}: ${nFree} boş saat</span>${brk?`<span class="brk">${brk.from}–${brk.to} ${brk.label}</span>`:""}</div>
      ${nFree ? `<div class="slots tnum">${sl.map(s=>`<button class="slot" data-time="${s.t}" data-who="${s.staff||""}" aria-pressed="${S.time===s.t}" ${s.free?"":"disabled"}>${s.t}</button>`).join("")}</div>`
        : `<div class="empty">${dlabel(S.date)} için boş saat kalmadı. Üstten başka bir gün seçin.</div>`}`;
  }
  if(step===3){
    const svc = SERVICES.find(s=>s.id===S.svc), st = STAFF.find(s=>s.id===(S.staffAssigned||S.staff));
    h = `<h2>Randevu kimin adına?</h2>
      <div class="fld"><label for="nm">Ad soyad</label><input id="nm" autocomplete="name" value="${S.name}" aria-invalid="${!!S.errs.nm}">${S.errs.nm?`<div class="err">${S.errs.nm}</div>`:""}</div>
      <div class="fld"><label for="ph">Cep telefonu</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" value="${S.phone}" placeholder="05__ ___ __ __" aria-invalid="${!!S.errs.ph}">${S.errs.ph?`<div class="err">${S.errs.ph}</div>`:""}</div>
      <div class="summary tnum">
        <div><span>Hizmet</span><span>${svc.n}</span></div>
        <div><span>Usta</span><span>${st.n}</span></div>
        <div><span>Tarih</span><span>${dlabel(S.date)}</span></div>
        <div><span>Saat</span><span>${S.time}–${toStr(toMin(S.time)+svc.min)}</span></div>
        <div class="tot"><span>Ücret</span><span>${tl(svc.p)}</span></div>
      </div><p class="note">Ödeme salonda. Randevudan 2 saat önce WhatsApp'tan hatırlatma gelir.</p>`;
  }
  if(step===4){
    const a = S.last, svc = SERVICES.find(s=>s.id===a.svc), st = STAFF.find(s=>s.id===a.staff);
    const msg = `Merhaba, randevumu onaylatmak istiyorum.\nAd: ${a.name}\nHizmet: ${svc.n} (${st.n})\nTarih: ${dlabel(a.date)}, ${a.time}`;
    h = `<div class="done"><div class="ck">${ico("i-check")}</div><h2>Randevunuz alındı</h2><p class="note" style="margin:0">${a.name}, ${dlabel(a.date)} saat ${a.time}'da ${st.n} sizi bekliyor.</p></div>
      <div class="summary tnum"><div><span>Hizmet</span><span>${svc.n}</span></div><div><span>Usta</span><span>${st.n}</span></div>
      <div><span>Tarih</span><span>${dlabel(a.date)}</span></div><div><span>Saat</span><span>${a.time}</span></div><div class="tot"><span>Ücret</span><span>${tl(svc.p)}</span></div></div>
      <a class="btn btn-wa" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}">${ico("i-wa")}Onayı WhatsApp'tan gönder</a>
      <p class="note" style="text-align:center">İptal ya da değişiklik için WhatsApp'tan yazmanız yeterli.</p>`;
  }
  $("#book").innerHTML = h;
  bar();
}
function bar(){
  const n = $("#next"), b = $("#back");
  b.hidden = !(S.step>0 && S.step<4);
  n.disabled = ![S.svc, S.staff, S.time, true, true][S.step];
  n.innerHTML = S.step===3 ? "Randevuyu onayla" : S.step===4 ? `${ico("i-cal")}Takvimime ekle` : "Devam et";
  $("#bar").querySelector(".new-one")?.remove();
  if(S.step===4) b.insertAdjacentHTML("beforebegin",`<button class="btn btn-q new-one" id="again">Yeni randevu</button>`);
}
$("#book").addEventListener("click", e => {
  const x = e.target.closest("button"); if(!x) return;
  if(x.dataset.svc){ S.svc = x.dataset.svc; S.time=null; S.step=1; render(); }
  else if(x.dataset.staff){ S.staff = x.dataset.staff; S.time=null; S.step=2; render(); }
  else if(x.dataset.day){ S.date = x.dataset.day; S.time = null; render(); }
  else if(x.dataset.time){ S.time = x.dataset.time; S.staffAssigned = x.dataset.who; render(); }
});
$("#book").addEventListener("input", e => { if(e.target.id==="nm") S.name = e.target.value; if(e.target.id==="ph") S.phone = e.target.value; });
$("#bar").addEventListener("click", e => {
  const x = e.target.closest("button"); if(!x) return;
  if(x.id==="again"){ Object.assign(S,{step:0,svc:null,staff:null,date:null,time:null,staffAssigned:null}); render(); return; }
  if(x.id==="back"){ S.step--; render(); return; }
  if(x.id!=="next") return;
  if(S.step===3){
    S.errs = {};
    if(S.name.trim().length < 3) S.errs.nm = "Adınızı ve soyadınızı yazın.";
    if(S.phone.replace(/\D/g,"").length < 10) S.errs.ph = "Numarayı 05 ile başlayan 11 hane olarak yazın.";
    if(S.errs.nm || S.errs.ph){ render(); $(S.errs.nm?"#nm":"#ph").focus(); return; }
    const a = {date:S.date, time:S.time, staff:S.staffAssigned||S.staff, svc:S.svc, name:S.name.trim(), phone:S.phone.trim(), created:Date.now()};
    store.set([...store.get(), a]); S.last = a; S.step = 4;
  } else if(S.step===4){ ics(); return; }
  else S.step++;
  render();
});
function ics(){
  const a = S.last, svc = SERVICES.find(s=>s.id===a.svc);
  const st = (a.date+"T"+a.time).replace(/[-:]/g,"")+"00", en = (a.date+"T"+toStr(toMin(a.time)+svc.min)).replace(/[-:]/g,"")+"00";
  const txt = ["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",`DTSTART:${st}`,`DTEND:${en}`,`SUMMARY:${CONFIG.name}: ${svc.n}`,`LOCATION:${CONFIG.address}`,"BEGIN:VALARM","TRIGGER:-PT2H","ACTION:DISPLAY","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  const u = URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));
  const l = document.createElement("a"); l.href=u; l.download="randevu.ics"; l.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* ---------- Esnaf paneli ---------- */
let PDAY = dkey(days().find(d=>!CONFIG.closedDays.includes(d.getDay())));
function renderPanel(){
  const list = allAppts(PDAY);
  const rev = list.reduce((s,a)=>s+SERVICES.find(x=>x.id===a.svc).p,0);
  const online = list.filter(a=>!a.seed).length;
  const closed = CONFIG.closedDays.includes(new Date(PDAY+"T12:00").getDay());
  $("#panel").innerHTML = `
    <p class="hello">Esnafın göreceği ekran. Müşteri "Randevu al" sekmesinden randevu aldığında burada hemen görünür.</p>
    <div class="pdays">${days().slice(0,7).map(d=>`<button data-pd="${dkey(d)}" aria-pressed="${dkey(d)===PDAY}">${dkey(d)===dkey(new Date())?"Bugün":dlabel(dkey(d)).split(",")[0]+" "+DAYS[d.getDay()]}</button>`).join("")}</div>
    <div class="kpis tnum"><div class="kpi"><b>${closed?0:list.length}</b><small>randevu</small></div><div class="kpi"><b>${tl(closed?0:rev)}</b><small>beklenen ciro</small></div><div class="kpi"><b>${online}</b><small>online gelen</small></div></div>
    ${closed ? `<div class="empty">Salon bu gün kapalı.</div>` :
      list.length ? list.map(a=>{const s=SERVICES.find(x=>x.id===a.svc), st=STAFF.find(x=>x.id===a.staff);
      return `<div class="appt"><div class="tm tnum">${a.time}</div><div><b>${a.name}</b>${a.seed?"":'<span class="new">Online</span>'}<small>${s.n}, ${st.n}, ${tl(s.p)}</small></div>
      ${a.seed?"<span></span>":`<div class="ops"><a target="_blank" rel="noopener" aria-label="WhatsApp" href="https://wa.me/90${a.phone.replace(/\D/g,"").replace(/^0/,"")}">${ico("i-wa")}</a><button data-del="${a.created}">İptal et</button></div>`}</div>`}).join("")
      : `<div class="empty">Bu gün için randevu yok.</div>`}`;
}
$("#panel").addEventListener("click", e => {
  const x = e.target.closest("button"); if(!x) return;
  if(x.dataset.pd){ PDAY = x.dataset.pd; renderPanel(); }
  if(x.dataset.del){ store.set(store.get().filter(a => String(a.created)!==x.dataset.del)); renderPanel(); }
});
$$(".tabs button").forEach(b => b.onclick = () => {
  $$(".tabs button").forEach(x=>x.setAttribute("aria-selected", x===b));
  const p = b.dataset.tab==="panel";
  $("#bookWrap").hidden = p; $("#panelWrap").hidden = !p;
  if(p) renderPanel();
});

/* ---------- salon bilgisi ---------- */
$("#bName").textContent = CONFIG.name; $("#bAddr").textContent = CONFIG.address; document.title = CONFIG.name + ", online randevu";
(function(){
  const n=new Date(), m=n.getHours()*60+n.getMinutes(), open=!CONFIG.closedDays.includes(n.getDay()) && m>=toMin(CONFIG.hours.open) && m<toMin(CONFIG.hours.close);
  $("#openNow").innerHTML = open ? `<span class="dot"></span><b>Şu an açık</b>, ${CONFIG.hours.close}'e kadar` : `<span class="dot off"></span><b>Şu an kapalı</b>, ${CONFIG.hours.open}'da açılıyor`;
  $("#hours").innerHTML = [1,2,3,4,5,6,0].map(d=>{
    const closed = CONFIG.closedDays.includes(d), b = CONFIG.breaks.find(x=>x.day===d);
    return `<div class="${d===n.getDay()?"today":""}"><span>${DAYS_L[d]}</span><span class="tnum">${closed?"Kapalı":`${CONFIG.hours.open}–${CONFIG.hours.close}${b?`, ${b.from}–${b.to} ara`:""}`}</span></div>`;
  }).join("");
})();
render();
</script>
</body>
</html>
